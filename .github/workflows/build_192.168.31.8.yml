name: Build OpenWrt for Mcuart Miniwork Station

on:
  workflow_dispatch:  # 支持在 GitHub 网页端手动点击运行
  #push:
  #  paths:            # 当你修改了 DTS、补丁或配置时自动触发编译
  #    - '**.dts'
  #    - '**.patch'
  #    - 'mcuart.seed'

permissions:
  contents: write     # 赋予自动创建 Release 并上传固件的权限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出当前定制仓库代码
        uses: actions/checkout@v4

      - name: 2. 清理 Runner 磁盘冗余并安装编译依赖
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev

      - name: 3. 克隆官方 OpenWrt 源码
        run: |
          git clone -b v25.12.6 --single-branch --depth 1 https://github.com/openwrt/openwrt.git openwrt

      - name: 4. 注入你的设备树、补丁与板级配置
        run: |
          mkdir -p openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
          cp rk3566-mcuart-miniwork-station.dts openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
          cp 999-arm64-dts-rockchip-add-mcuart-miniwork-station.patch openwrt/target/linux/rockchip/patches-6.12/
          mkdir -p openwrt/files/etc/openclash/core/
          cp clash_meta openwrt/files/etc/openclash/core/
          chmod +x openwrt/files/etc/openclash/core/clash_meta
          cd openwrt
          git apply ../mcuart-openwrt-board.patch
          sed -i 's/192.168.1.1/192.168.31.8/g' package/base-files/files/bin/config_generate
          sed -i 's/OpenWrt/MiniWorkStation/g' package/base-files/files/bin/config_generate
          sed -i "s/'GMT0'/'GMT-8'/g; s/'UTC'/'Asia\/Shanghai'/g" package/base-files/files/bin/config_generate


      - name: 5. 更新并安装 Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 还原精简配置 (.seed -> .config)
        working-directory: openwrt
        run: |
          cp ../mcuart.seed .config
          make defconfig

      - name: 7. 下载源码包并多线程编译
        working-directory: openwrt
        run: |
          make download -j8
          make -j$(nproc)

      - name: 8. 整理固件并发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mcuart Miniwork Station Firmware #${{ github.run_number }}
          body: |
            ### 固件构建信息
            - **触发提交**: ${{ github.event.head_commit.message }}
            - **Commit ID**: ${{ github.sha }}
          files: |
            openwrt/bin/targets/rockchip/armv8/*sysupgrade.img.gz
            openwrt/bin/targets/rockchip/armv8/*.manifest
